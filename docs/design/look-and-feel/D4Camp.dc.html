<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>Saturday-morning flat — Camp</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: inherit; } a:hover { color: inherit; }

    .card { background: #fff7e6; border: 4px solid #1b1b2f; border-radius: 18px; box-shadow: 6px 6px 0 #1b1b2f; }
    .blob { position: absolute; border-radius: 50%; background: #23949c; }
    .btn { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: #1b1b2f; background: #ffd23f; border: 4px solid #1b1b2f; border-radius: 999px; box-shadow: 4px 4px 0 #1b1b2f; padding: 8px 22px; }
    .btn.primary { background: #ff6b3d; color: #fff7e6; }
    .boing { animation: boing 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
    @keyframes boing { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.05) scaleX(.98); } }
    
  </style>
</helmet>
<div style="position:relative;width:960px;height:540px;overflow:hidden;background:#1e7f86;font-family:'Nunito', 'Trebuchet MS', sans-serif;color:#1b1b2f">
    <div class="blob" style="left:-100px;top:-100px;width:420px;height:420px"></div><div class="blob" style="left:700px;top:320px;width:360px;height:360px"></div>
    <div class="card" style="position:absolute;left:40px;top:40px;width:500px;height:460px;padding:0;overflow:hidden"><div style="width:500px;height:460px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Nunito', 'Trebuchet MS', sans-serif;font-size:12px;color:#5b6b7b;border:2px dashed #5b6b7b;border-radius:8px;border:0;border-radius:14px">[art: the party at camp, flat vector, one of them holding the map upside down]</div></div>
    <div class="card boing" style="position:absolute;left:600px;top:50px;width:290px;padding:16px;display:flex;flex-direction:column;gap:8px">
      <div style="font-family:'Fredoka', 'Trebuchet MS', sans-serif;font-weight:700;font-size:38px;color:#1b1b2f">Camp</div>
      <div style="font-family:'Nunito', 'Trebuchet MS', sans-serif;font-weight:800;font-size:14px;color:#1b1b2f">The party argues over who lost the map.</div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:6px"><div style="font-family:'Fredoka', 'Trebuchet MS', sans-serif;font-weight:700;font-size:20px;color:#1b1b2f">Lv 2</div>
        <div style="flex:1;height:14px;border:3px solid #1b1b2f;border-radius:999px;background:#fff;overflow:hidden"><div style="width:23%;height:100%;background:#ff6b3d"></div></div></div>
      <div style="font-family:'Nunito', 'Trebuchet MS', sans-serif;font-size:12px;color:#5b6b7b">Weapon: Rusty Shortsword · Armor: — empty — · Trinket: Lucky Charm</div>
    </div>
    <div style="position:absolute;left:600px;top:310px;display:flex;flex-direction:column;gap:14px;width:290px">
      <div class="btn primary" style="text-align:center;font-size:24px">Start Run</div>
      <div style="display:flex;gap:12px"><div class="btn" style="flex:1;text-align:center">Skill Tree</div><div class="btn" style="flex:1;text-align:center">Inventory</div></div>
    </div>
</div>
</x-dc>
</body>
</html>
