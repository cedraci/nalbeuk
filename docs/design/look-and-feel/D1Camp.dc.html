<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>Bande dessinée — Camp</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@500;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: inherit; } a:hover { color: inherit; }

    .halftone { background-image: radial-gradient(#1b1a17 0.9px, transparent 1px); background-size: 6px 6px; opacity: .18; }
    .panel { background: #fffaf0; border: 3px solid #1b1a17; box-shadow: 5px 5px 0 #1b1a17; }
    .tilt-l { transform: rotate(-0.8deg); } .tilt-r { transform: rotate(0.6deg); }
    .bubble { position: relative; background: #fffaf0; border: 3px solid #1b1a17; border-radius: 22px; padding: 10px 14px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px; }
    .bubble:after { content: ""; position: absolute; left: 28px; bottom: -14px; border: 8px solid transparent; border-top: 10px solid #1b1a17; border-bottom: 0; }
    .bubble:before { content: ""; position: absolute; left: 31px; bottom: -8px; border: 5px solid transparent; border-top: 8px solid #fffaf0; border-bottom: 0; z-index: 1; }
    .fx { font-family: 'Bangers', sans-serif; color: #e63b2e; -webkit-text-stroke: 1.5px #1b1a17; letter-spacing: 1px; }
    .btn { font-family: 'Bangers', sans-serif; font-size: 20px; letter-spacing: 1px; color: #1b1a17; background: #f7c948; border: 3px solid #1b1a17; box-shadow: 3px 3px 0 #1b1a17; padding: 8px 18px; }
    .btn.primary { background: #e63b2e; color: #fffaf0; }
    
  </style>
</helmet>
<div style="position:relative;width:960px;height:540px;overflow:hidden;background:#f4ecd8;font-family:'Nunito', 'Trebuchet MS', sans-serif;color:#1b1a17">
    <div class="halftone" style="position:absolute;inset:0"></div>
    <div class="panel" style="position:absolute;left:30px;top:30px;width:520px;height:480px;padding:0;overflow:hidden"><div style="width:520px;height:480px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Nunito', 'Trebuchet MS', sans-serif;font-size:12px;color:#6b6558;border:2px dashed #6b6558;border-radius:8px;border:0;border-radius:0">[art: splash page: the party around a campfire, one of them asleep on the map]</div></div>
    <div class="fx" style="position:absolute;left:52px;top:36px;font-size:64px;transform:rotate(-4deg)">CAMP</div>
    <div class="bubble tilt-r" style="position:absolute;left:330px;top:400px;width:200px">"Who lost the map?"</div>
    <div class="panel tilt-l" style="position:absolute;left:600px;top:60px;width:300px;padding:16px;display:flex;flex-direction:column;gap:12px">
      <div style="font-family:'Bangers', 'Impact', 'Arial Narrow', sans-serif;font-size:30px;letter-spacing:1px">LV 2 · 7/30 XP</div>
      <div style="font-family:'Nunito', 'Trebuchet MS', sans-serif;font-weight:800;font-size:14px">1 skill point burning a hole in your pocket</div>
      <div style="font-family:'Nunito', 'Trebuchet MS', sans-serif;font-size:13px;color:#6b6558">Weapon: Rusty Shortsword · Armor: — empty — · Trinket: Lucky Charm</div>
    </div>
    <div style="position:absolute;left:600px;top:290px;display:flex;flex-direction:column;gap:14px;width:300px">
      <div class="btn primary" style="font-size:26px;text-align:center">START RUN</div>
      <div style="display:flex;gap:12px"><div class="btn" style="flex:1;text-align:center">Skill Tree</div><div class="btn" style="flex:1;text-align:center">Inventory</div></div>
    </div>
</div>
</x-dc>
</body>
</html>
